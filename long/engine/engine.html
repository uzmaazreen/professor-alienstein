<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Poppins';font-weight:100 599;src:url(assets/fonts/Poppins-Medium.ttf)}
@font-face{font-family:'Poppins';font-weight:600 900;src:url(assets/fonts/Poppins-Bold.ttf)}
@font-face{font-family:'Lora';font-weight:400 900;src:url(assets/fonts/Lora-Variable.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#222;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0d1626;font-family:'Poppins',sans-serif;color:#2a2033}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#hud{position:absolute;left:960px;top:470px;width:0;height:0}
.item{position:absolute;left:0;top:0;will-change:transform}
.word{font-family:'Lora',serif;font-weight:700;line-height:1;white-space:nowrap;color:#1f1a2b;letter-spacing:-2px;padding:4px 18px}
.hl{background:linear-gradient(transparent 52%,#ffe14d 52%,#ffe14d 92%,transparent 92%)}
.hl.o{background:linear-gradient(transparent 52%,#ff9a4d 52%,#ff9a4d 92%,transparent 92%)}
.hl.b{background:linear-gradient(transparent 52%,#8fd3ff 52%,#8fd3ff 92%,transparent 92%)}
.hl.p{background:linear-gradient(transparent 52%,#cdb4ff 52%,#cdb4ff 92%,transparent 92%)}
.hl.r{background:linear-gradient(transparent 52%,#ff8f8a 52%,#ff8f8a 92%,transparent 92%)}
.sticky{width:400px;min-height:230px;padding:26px 28px;background:linear-gradient(160deg,#ffe98a,#ffd95a);font:700 38px/1.15 'Poppins';color:#3a2c12;position:relative}
.sticky:after{content:"";position:absolute;right:0;bottom:0;width:60px;height:60px;background:linear-gradient(135deg,rgba(0,0,0,0) 50%,rgba(150,110,20,.35) 50%)}
.sticky small{display:block;font-size:30px;font-weight:600;opacity:.8;margin-top:10px}
.strip{background:#fbf8f0;padding:22px 34px;font:800 52px/1 'Poppins';color:#2a2033;white-space:nowrap;clip-path:polygon(0 8%,4% 0,12% 6%,22% 0,35% 7%,48% 0,61% 6%,75% 0,88% 7%,100% 0,98% 52%,100% 100%,86% 93%,70% 100%,55% 94%,40% 100%,25% 93%,10% 100%,3% 92%,0 100%,2% 50%)}
.tag{background:rgba(18,22,32,.82);border-radius:60px;padding:8px 22px;font:700 30px/1 'Poppins';color:#fff;white-space:nowrap;display:flex;align-items:center;gap:12px}
.tag i{width:22px;height:22px;border-radius:50%;display:block}
.pol{width:420px;background:#fcfbf7;padding:20px 20px 74px;position:relative}
.pol .pic{width:380px;height:300px;position:relative;overflow:hidden;background:#e9e2d3}
.pol .cap{position:absolute;left:0;right:0;bottom:18px;text-align:center;font:700 30px 'Poppins';color:#2a2033}
.tape{position:absolute;width:150px;height:46px;background:rgba(255,236,170,.75);top:-20px;left:50%;margin-left:-75px;transform:rotate(-3deg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pill{background:rgba(18,22,32,.85);color:#fff;border-radius:70px;padding:14px 34px;font:800 40px/1 'Poppins';white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 55%,rgba(40,25,10,.5) 100%)}
#light{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.8;background:linear-gradient(112deg,rgba(0,0,0,0) 8%,rgba(255,240,200,.95) 22%,rgba(255,240,200,.95) 34%,rgba(0,0,0,0) 46%,rgba(0,0,0,.45) 58%,rgba(0,0,0,0) 66%)}
#grain{position:absolute;inset:-20px;pointer-events:none;background:url(assets/grain.png);mix-blend-mode:overlay;opacity:.14}
#dust{position:absolute;inset:0;pointer-events:none}
.d{position:absolute;border-radius:50%;background:rgba(255,255,255,.85);filter:blur(1px)}
#endv{position:absolute;inset:0;background:rgba(244,234,214,.6);backdrop-filter:blur(10px);opacity:0;pointer-events:none}
#glitch{position:absolute;inset:0;pointer-events:none;mix-blend-mode:difference}
#glitch i{position:absolute;left:0;right:0;background:#ff3d8b}
#cap{position:absolute;left:420px;width:1080px;top:940px;text-align:center;font:800 54px/1.05 'Poppins';color:#fff;paint-order:stroke fill;-webkit-text-stroke:10px #111;text-shadow:0 5px 0 #111;letter-spacing:-1px}
#cap span.on{color:#ffd23f}
#mascot{position:absolute;left:-20px;top:440px;width:492px;height:650px;transform-origin:50% 100%;filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 12px 16px rgba(0,0,0,.4))}
</style>
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <div id="light"></div>
  <div id="vig"></div>
  <div id="dust"></div>
  <div id="endv"></div>
  <div id="hud"></div>
  <div id="cap"></div>
  <div id="mascot"></div>
  <div id="grain"></div>
</div>
<script>
const TID=new URLSearchParams(location.search).get('topic')||'smog';
document.write('<script src="../work/timings.js"><\/script>');
document.write('<script src="../topics/'+TID+'.js"><\/script>');
</script>
<script src="engine.js"></script>
</body></html>
