name: Render test video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install packages
        working-directory: my-video
        run: npm install

      - name: Get Chrome Headless Shell
        working-directory: my-video
        run: npx remotion browser ensure

      - name: Render the video
        working-directory: my-video
        run: npx remotion render film out/film.mp4

      - name: Save the video
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: my-video/out/episode.mp4
