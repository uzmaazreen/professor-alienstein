name: Daily video

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Video length in minutes (3 = quick test)"
        default: "3"
      upload:
        description: "Upload to YouTube? yes or no"
        default: "no"

permissions:
  contents: write

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MINUTES: ${{ github.event.inputs.minutes || '10' }}
      DO_UPLOAD: ${{ github.event.inputs.upload == 'yes' || (github.event_name == 'schedule' && vars.ENABLE_UPLOAD == 'true') }}
      PRIVACY: ${{ vars.PRIVACY || 'private' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Get private voice sample
        uses: actions/checkout@v4
        with:
          repository: uzmaazreen/alienstein-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libcups2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Remember the voice model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Install video maker
        working-directory: my-video
        run: |
          npm install
          npx remotion browser ensure

      - name: 1. Pick today's topic
        run: python pipeline/pick_topic.py

      - name: 2. Write the script with Gemini
        run: python pipeline/write_script.py

      - name: 3. Make the voice and lip-sync (slow)
        run: |
          cp private/my_voice.mp3 my_voice.mp3
          cp work/script_scenes.txt script_scenes.txt
          rm -rf my-video/public/audio my-video/public/scenes.json
          python pipeline/speak_scenes.py

      - name: 4. Title, tags and description
        run: |
          python pipeline/write_meta.py
          python pipeline/build_description.py

      - name: 5. Render the video
        working-directory: my-video
        run: npx remotion render Film out/long.mp4

      - name: 6. Upload to YouTube (only if switched on)
        if: env.DO_UPLOAD == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/upload_youtube.py my-video/out/long.mp4

      - name: 7. Remember this topic (only after upload)
        if: env.DO_UPLOAD == 'true'
        run: |
          python pipeline/finish.py
          git config user.name "alienstein-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "Remember today's topic" || echo "nothing to save"
          git push

      - name: Save the result package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-package
          retention-days: 3
          path: |
            my-video/out/long.mp4
            work/topic.json
            work/script_scenes.txt
            work/meta.json
            work/description.txt
